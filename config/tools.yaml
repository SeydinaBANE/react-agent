tools:
  web_search:
    timeout_seconds: 15
    max_results: 5
    allowed_domains: []  # empty = all domains allowed

  code_executor:
    timeout_seconds: 10
    max_output_chars: 5000
    forbidden_modules:
      - os
      - subprocess
      - sys
      - socket
      - importlib
      - shutil

  file_io:
    allowed_paths:
      - /tmp
      - /workspace
    max_file_size_kb: 1024

  http_client:
    timeout_seconds: 15
    allowed_url_prefixes: []  # empty = all URLs allowed
    max_response_chars: 10000

  memory_tool:
    top_k: 5
    score_threshold: 0.6
