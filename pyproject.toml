[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "react-agent"
version = "0.1.0"
description = "Autonomous ReAct agent with episodic memory, tool use, and human-in-the-loop approval"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
keywords = ["llm", "agent", "react", "rag", "tool-use"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "openai>=1.51",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.4",
  "qdrant-client>=1.11",
  "sentence-transformers>=3.1",
  "httpx>=0.27",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "tenacity>=9.0",
  "pyyaml>=6.0",
  "python-jose[cryptography]>=3.3",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "pytest-httpx>=0.30",
  "testcontainers[qdrant]>=4.8",
  "ruff>=0.6.9",
  "mypy>=1.11",
  "bandit[toml]>=1.7.10",
  "safety>=3.2.9",
  "pip-audit>=2.7",
  "commitizen>=3.29",
  "detect-secrets>=1.5",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "ANN", "RUF"]
ignore = [
  "ANN101",  # Missing type annotation for `self`
  "ANN102",  # Missing type annotation for `cls`
  "S101",    # Use of assert (allowed in tests)
]
per-file-ignores = { "tests/**/*.py" = ["S101", "ANN"] }

[tool.ruff.lint.isort]
known-first-party = ["agent"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = "src"
namespace_packages = true

[[tool.mypy.overrides]]
module = [
  "sentence_transformers.*",
  "qdrant_client.*",
  "prometheus_client.*",
  "slowapi.*",
  "jose.*",
  "openai.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
skips = ["B101"]  # assert_used — allowed

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "--cov=src",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=80",
  "-v",
]
markers = [
  "unit: fast isolated tests (no external services)",
  "integration: tests that require running services (Qdrant)",
  "slow: tests that take more than 5 seconds",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "notebooks/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
]

# ---------------------------------------------------------------------------
# Commitizen
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
